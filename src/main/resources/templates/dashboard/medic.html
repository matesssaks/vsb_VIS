<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{dashboard/_dashboard}"
>
<head>
	<title><th:block th:text="#{app.name}"></th:block> | Medic</title>
</head>
<main layout:fragment="content">
	<button class="w-75 btn icon-link bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center">
		<span class="fs-2">Generate drug plan</span>
	</button>
	<div th:each="task : ${tasks}" class="w-75 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center">
		<span class="fw-semibold"><span th:text="${task.shortDescription}"></span></span>
		<div class="d-flex gap-3">
			<button class="btn icon-link p-1 fs-2 text-success" type="button">
				<i class="bi bi-plus"></i>
			</button>
			<button class="btn icon-link p-1 fs-2 text-danger" type="button">
				<i class="bi bi-check-square"></i>
			</button>
		</div>
	</div>
</main>
