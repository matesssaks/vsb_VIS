<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{_base}"
>
<div layout:fragment="side">
	<nav class="sticky-top nav nav-pills flex-column px-3 pt-4 gap-3">
		<span>Dashboard</span>
		<template x-if="user">
			<a :class="'nav-link fs-4 pe-5' + (page === 'instructor' ? ' active' : '')"
			   href="/instructor"
			   x-show="user.instructor">Instructor</a>
		</template>
		<a :class="'nav-link fs-4 pe-5' + (page === 'persons' ? ' active' : '')"
		   href="/persons">Persons</a>
		<a :class="'nav-link fs-4 pe-5' + (page === 'registrations' ? ' active' : '')"
		   href="/registrations">Registrations</a>
	</nav>
</div>
