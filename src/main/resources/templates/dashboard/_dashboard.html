<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{_base}"
>
<div layout:fragment="side">
	<nav class="sticky-top nav nav-pills flex-column px-3 pt-4 gap-3">
		<span th:text="${camp.name}"></span>
		<a th:class="'nav-link fs-4 pe-5' + (${page} == 'tasks' ? ' active' : '')"
		   th:href="@{'/camp/' + ${camp.id} + '/tasks'}">Tasks</a>
		<a th:class="'nav-link fs-4 pe-5' + (${page} == 'medic' ? ' active' : '')"
		   th:href="@{'/camp/' + ${camp.id} + '/medic'}">Medic plan</a>
	</nav>
</div>
