<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{dashboard/_dashboard}"
>
<head>
	<title><th:block th:text="#{app.name}"></th:block> | Medic</title>
</head>
<main layout:fragment="content">
    <form th:action="@{/camp/{id}/medic(id=${camp.id})}" method="post" class="w-75 d-flex flex-column gap-3">
        <button class="w-100 btn bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center"
                type="submit">
            <span class="fs-3" th:if="${tasks.isEmpty()}">Generate drug plan</span>
            <span class="fs-3" th:if="!${tasks.isEmpty()}">Save drug plan</span>
        </button>
        <div class="alert alert-danger m-0 w-100 text-center" th:if="${errors} != null and !${errors.isEmpty()}">
            <div th:each="error : ${errors}" th:text="${error}"></div>
        </div>
        <div th:each="task : ${tasks}" class="w-100 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><span th:text="${task.shortDescription}"></span> (<span th:text="${#temporals.format(task.startDate, 'SHORT', #locale)}"></span> - <span th:text="${#temporals.format(task.dueDate, 'SHORT', #locale)}"></span>)</span>
            <div class="form-floating">
                <select class="form-select"
                        th:id="${'medic_' + task.id}"
                        th:name="${'medic[' + task.id + ']'}" required>
                    <option th:each="participant : ${participants}"
                            th:value="${participant.id}"
                            th:text="${participant.person.name}"
							th:selected="${task.participants != null and !task.participants.isEmpty() and participant.id == task.participants[0].id}">
                    </option>
                </select>
                <label th:for="${'medic_' + task.id}">Assignee</label>
            </div>
            <input type="hidden" th:name="${'shortDescription[' + task.id + ']'}" th:value="${task.shortDescription}" />
            <input type="hidden" th:name="${'description[' + task.id + ']'}" th:value="${task.description}" />
            <input type="hidden" th:name="${'startDate[' + task.id + ']'}" th:value="${#temporals.format(task.startDate, 'yyyy-MM-dd''T''HH:mm:ss')}" />
            <input type="hidden" th:name="${'dueDate[' + task.id + ']'}" th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd''T''HH:mm:ss')}" />
        </div>
    </form>
</main>
