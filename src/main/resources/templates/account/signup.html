<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{_base}"
>
<head>
	<title><th:block th:text="#{app.name}"></th:block> | Login</title>
</head>
<div layout:fragment="header_buttons"></div>

<main layout:fragment="content">
	<div class="w-25 flex-grow-1 h-100 d-flex flex-column justify-content-center">
		<form class="bg-white rounded-3 p-3 d-flex flex-column align-items-center gap-4" method="post">
			<span class="fs-2 fw-semibold lh-1">Sign Up</span>
			<div class="form-floating w-100">
				<input class="form-control" id="email" name="email" type="email" placeholder="Email" required>
				<label for="email">Email</label>
			</div>
			<div class="d-flex gap-3 w-100">
				<div class="flex-grow-1 w-50 form-floating">
					<input class="form-control" id="firstname" name="firstname" type="text" placeholder="First name" required>
					<label for="firstname">First name</label>
				</div>
				<div class="flex-grow-1 w-50 form-floating">
					<input class="form-control" id="lastname" name="lastname" type="text" placeholder="Last name" required>
					<label for="lastname">Last name</label>
				</div>
			</div>
			<div class="form-floating w-100">
				<input class="form-control" id="password" name="password" type="password" placeholder="Password" required>
				<label for="password">Password</label>
			</div>
			<div class="form-floating w-100">
				<input class="form-control" id="password2" name="password2" type="password" placeholder="Confirm password" required>
				<label for="password2">Confirm password</label>
			</div>
			<div class="alert alert-danger m-0 w-100 text-center" th:if="${!errors.isEmpty()}">
				<div th:each="error : ${errors}" th:text="${error}"></div>
			</div>
			<button class="btn btn-primary px-3 py-2" type="submit">Sign Up</button>
			<span>Already have an account? <a class="link-primary" th:href="@{/login}">Log in.</a></span>
		</form>
	</div>
</main>
