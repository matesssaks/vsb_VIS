<div class="modal-dialog modal-dialog-centered">
	<div class="modal-content">
		<div class="modal-header">
			<h5 class="modal-title">Confirm delete</h5>
			<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		</div>
		<div class="modal-body d-flex flex-column align-items-center gap-4">
			<span>Are you sure you want to delete <strong th:text="${person.name}"></strong>?</span>
		</div>
		<form th:onsubmit="|return postModal('@{/persons/delete/{id}(id=${person.id})}', event, this);|" method="post">
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="submit" class="btn btn-danger">Delete</button>
			</div>
		</form>
	</div>
</div>
