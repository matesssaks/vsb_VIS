<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{dashboard/_dashboard}"
>
<head>
	<title><th:block th:text="#{app.name}"></th:block> | Persons</title>
</head>
<main layout:fragment="content">
	<button class="w-75 btn icon-link bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center">
		<i class="bi bi-plus-lg fs-2"></i>
	</button>
	<template x-for="person in persons">
		<div class="w-75 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center">
			<span class="fw-semibold"><span x-text="person.firstName"></span> <span x-text="person.lastName"></span></span>
			<div class="d-flex gap-3">
				<button class="btn icon-link p-1 fs-2 text-primary" type="button" @click="editPerson(person)">
					<i class="bi bi-pen"></i>
				</button>
				<button class="btn icon-link p-1 fs-2 text-danger" type="button" @click="deletePerson(person)">
					<i class="bi bi-trash"></i>
				</button>
			</div>
		</div>
	</template>

	<div id="editPersonModal" class="modal fade" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Edit person</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<form>
					<div class="modal-body d-flex flex-column align-items-center gap-4">
						<div class="d-flex gap-3 w-100">
							<div class="flex-grow-1 w-50 form-floating">
								<input class="form-control" id="firstname" name="firstname" type="text" placeholder="First name" autofocus required>
								<label for="firstname">First name</label>
							</div>
							<div class="flex-grow-1 w-50 form-floating">
								<input class="form-control" id="lastname" name="lastname" type="text" placeholder="Last name" required>
								<label for="lastname">Last name</label>
							</div>
						</div>
						<div class="d-flex gap-3 w-100">
							<div class="flex-grow-1 w-50 form-floating">
								<input class="form-control" id="city" name="city" type="text" placeholder="City" required>
								<label for="city">City</label>
							</div>
							<div class="flex-grow-1 w-50 form-floating">
								<input class="form-control" id="postal" name="postal" type="text" placeholder="Postal code" required>
								<label for="postal">Postal code</label>
							</div>
						</div>
						<div class="form-floating w-100">
							<input class="form-control" id="street" name="street" type="text" placeholder="Street" required>
							<label for="street">Street</label>
						</div>
						<div class="form-floating w-100">
							<input class="form-control" id="born" name="born" type="text" placeholder="Born date" required>
							<label for="born">Born date</label>
						</div>
						<!--
						<div class="alert alert-danger m-0 w-100 text-center" x-show="errors">
							<template x-for="error in errors">
								<div x-text="error"></div>
							</template>
						</div>
						-->
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary px-3 py-2">Save</button>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div id="deletePersonModal" class="modal fade" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Confirm delete</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body d-flex flex-column align-items-center gap-4">
					<span>Are you sure you want to delete <strong x-text="firstname"></strong> <strong x-text="lastname"></strong>?</span>
					<!--
					<div class="alert alert-danger m-0 w-100 text-center" x-show="errors">
						<template x-for="error in errors">
							<div x-text="error"></div>
						</template>
					</div>
					-->
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-danger" @click="remove">Delete</button>
				</div>
			</div>
		</div>
	</div>
</main>
