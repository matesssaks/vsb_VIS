<!doctype html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{user/_user}"
>
<head>
	<title><th:block th:text="#{app.name}"></th:block> | Persons</title>
</head>
<main layout:fragment="content">
	<button class="w-75 btn icon-link bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center"
			th:onclick="|getModal('@{/persons/new}')|">
		<i class="bi bi-plus-lg fs-2"></i>
	</button>
	<div th:each="person : ${persons}" class="w-75 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center">
		<span class="fw-semibold"><span th:text="${person.name}"></span></span>
		<div class="d-flex gap-3">
			<button class="btn icon-link p-1 fs-2 text-success" type="button" th:onclick="|getModal('@{/persons/register/{id}(id=${person.id})}')|">
				<i class="bi bi-plus"></i>
			</button>
			<button class="btn icon-link p-1 fs-2 text-primary" type="button" th:onclick="|getModal('@{/persons/edit/{id}(id=${person.id})}')|">
				<i class="bi bi-pen"></i>
			</button>
			<button class="btn icon-link p-1 fs-2 text-danger" type="button" th:onclick="|getModal('@{/persons/delete/{id}(id=${person.id})}')|">
				<i class="bi bi-trash"></i>
			</button>
		</div>
	</div>
</main>
