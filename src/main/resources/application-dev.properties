spring.application.name=CampManagement

# Connect to database
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.locations=classpath:migrations

# Where to store XML files
xml.path=${SPRING_XML_PATH}

# Set the server address
server.port=${SPRING_SERVER_PORT}
server.host=${SPRING_SERVER_HOST}

# From where to serve static files
server.static=classpath:static

# Disable Template cache
template.cache=false

# Enable debug logging
logging.level.cz.vsb.and0153=DEBUG
